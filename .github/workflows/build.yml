name: Compilar Modulo JASP
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          path: OPEX
      - name: Empacotar no formato JASP
        run: tar -czvf OPEX.jaspModule OPEX/
      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: OPEX_Modulo
          path: OPEX.jaspModule
